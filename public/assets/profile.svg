<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141922" />
      <stop offset="50%" stop-color="#0E1116" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <radialGradient id="cyanRim" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#6CC8FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6CC8FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0D0F12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6CC8FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6CC8FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6CC8FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="400" cy="380" r="320" fill="url(#cyanRim)" />

  <!-- Subtle grid pattern inside card -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000" />
    <line x1="250" y1="0" x2="250" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="550" y1="0" x2="550" y2="1000" />
    <line x1="700" y1="0" x2="700" y2="1000" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
  </g>

  <!-- Camera Reticle / Cinematic Viewfinder -->
  <g stroke="#6CC8FF" stroke-width="1.5" opacity="0.65">
    <!-- Top Left -->
    <path d="M 60 100 L 60 60 L 100 60" fill="none" />
    <!-- Top Right -->
    <path d="M 700 60 L 740 60 L 740 100" fill="none" />
    <!-- Bottom Left -->
    <path d="M 60 900 L 60 940 L 100 940" fill="none" />
    <!-- Bottom Right -->
    <path d="M 700 940 L 740 940 L 740 900" fill="none" />
    <!-- Center Crosshairs -->
    <line x1="380" y1="400" x2="420" y2="400" />
    <line x1="400" y1="380" x2="400" y2="420" />
  </g>

  <!-- Cinema Metatags -->
  <text x="70" y="95" fill="#8C929B" font-family="'Space Grotesk', monospace" font-size="13" letter-spacing="3">REC [●] 24FPS</text>
  <text x="700" y="95" fill="#8C929B" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="13" letter-spacing="3">4K PRORES RAW</text>
  <text x="70" y="925" fill="#8C929B" font-family="'Space Grotesk', monospace" font-size="13" letter-spacing="3">SHUTTER 180°</text>
  <text x="700" y="925" fill="#6CC8FF" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="13" letter-spacing="3">LUT: CINE_NOIR</text>

  <!-- Stylized Motion Designer Silhouette -->
  <g transform="translate(400, 480)">
    <!-- Aura rings -->
    <circle cx="0" cy="-70" r="160" stroke="#6CC8FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
    <circle cx="0" cy="-70" r="180" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Head / Torso Geometric Silhouette -->
    <circle cx="0" cy="-100" r="85" fill="#1C222C" stroke="#2B3545" stroke-width="2" />
    <path d="M -160 160 C -160 50, -90 10, 0 10 C 90 10, 160 50, 160 160 Z" fill="#171C25" stroke="#2B3545" stroke-width="2" />

    <!-- Motion Designer Goggles / Lens Reticle -->
    <rect x="-55" y="-120" width="110" height="24" rx="12" fill="#0D0F12" stroke="#6CC8FF" stroke-width="1.5" />
    <circle cx="-25" cy="-108" r="6" fill="#6CC8FF" opacity="0.8" />
    <circle cx="25" cy="-108" r="6" fill="#6CC8FF" opacity="0.8" />

    <!-- Waveform Frequency on chest -->
    <path d="M -90 80 Q -60 40 -30 80 T 30 80 T 90 80" fill="none" stroke="#6CC8FF" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Editorial Info Plate -->
  <rect x="180" y="780" width="440" height="80" rx="40" fill="#13171E" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="400" y="815" fill="#F2F2F2" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" letter-spacing="4">ROFIQUE CHOWDHURY</text>
  <text x="400" y="842" fill="#8C929B" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" letter-spacing="2">SENIOR VISUALIZER &amp; MOTION DESIGNER</text>

  <!-- Accent glow strip -->
  <line x1="200" y1="860" x2="600" y2="860" stroke="url(#glowLine)" stroke-width="2" />
</svg>
