<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>
    <radialGradient id="cyanCore1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6CC8FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg1)" />
  <circle cx="600" cy="400" r="350" fill="url(#cyanCore1)" />

  <!-- Chrono Circles -->
  <g transform="translate(600,400)">
    <circle cx="0" cy="0" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#6CC8FF" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.7" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="#13171F" stroke="#6CC8FF" stroke-width="1.5" />
    <!-- Chrono hands -->
    <line x1="0" y1="0" x2="85" y2="-85" stroke="#F2F2F2" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-40" y2="70" stroke="#6CC8FF" stroke-width="2" stroke-linecap="round" />
    <!-- Ticks -->
    <circle cx="0" cy="-200" r="4" fill="#6CC8FF" />
    <circle cx="200" cy="0" r="4" fill="#6CC8FF" />
    <circle cx="0" cy="200" r="4" fill="#6CC8FF" />
    <circle cx="-200" cy="0" r="4" fill="#6CC8FF" />
  </g>

  <!-- Viewfinder Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800" />
    <line x1="1080" y1="0" x2="1080" y2="800" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="680" x2="1200" y2="680" />
  </g>

  <!-- Labels -->
  <text x="140" y="150" fill="#8C929B" font-family="'Space Grotesk', monospace" font-size="14" letter-spacing="3">01 // BRAND FILM</text>
  <text x="1060" y="150" fill="#6CC8FF" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="14" letter-spacing="2">4K CINEMATIC</text>
  <text x="140" y="660" fill="#F2F2F2" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="2">AURA CHRONOS</text>
  <text x="140" y="695" fill="#8C929B" font-family="'Inter', sans-serif" font-size="14" letter-spacing="1">PREMIERE PRO · AFTER EFFECTS · DAVINCI RESOLVE</text>
  <text x="1060" y="660" fill="#8C929B" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="16">00:01:30:00</text>
</svg>
