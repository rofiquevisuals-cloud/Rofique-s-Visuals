  <text x="140" y="660" fill="#F2F2F2" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" letter-spacing="2">LUMINA SLATE</text>
  <text x="140" y="695" fill="#8C929B" font-family="'Inter', sans-serif" font-size="14" letter-spacing="1">AFTER EFFECTS · PREMIERE PRO · 3D COMPOSITING</text>
  <text x="1060" y="660" fill="#8C929B" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="16">00:01:00:00</text>
</svg>
