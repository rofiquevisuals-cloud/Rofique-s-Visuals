<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0A0C0F" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg5)" />

  <!-- Isometric Hardware Tablet / Device -->
  <g transform="translate(600, 390) scale(1.1)">
    <!-- Device Body -->
    <polygon points="0,-140 240,-10 0,120 -240,-10" fill="#18202A" stroke="#2B3648" stroke-width="2" />
    <!-- Bezel & OLED screen -->
    <polygon points="0,-125 215,-10 0,105 -215,-10" fill="#0C0E13" stroke="#6CC8FF" stroke-width="1.5" />
    <!-- Gradient screen emission -->
